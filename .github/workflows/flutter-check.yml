name: Flutter Android checks
on:
  push:
    branches: [feature/digits-neshan-integration]
  pull_request:
    branches: [main]
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ake_app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test
      - run: flutter build apk --debug --target-platform android-arm64
